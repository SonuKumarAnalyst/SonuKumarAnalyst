<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="auto" fill="none">
  <defs>
    <style>
      @keyframes radarExpand {
        0% { transform: scale(0.1); opacity: 0; }
        70% { transform: scale(1.04); opacity: 0.95; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes vertexPop {
        0% { transform: scale(0); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes barGrow {
        0% { transform: scaleX(0); }
        100% { transform: scaleX(1); }
      }
      .radar-poly {
        transform-origin: 225px 195px;
        animation: radarExpand 1.0s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .radar-sweep-beam {
        transform-origin: 225px 195px;
        animation: radarSweep 8s linear infinite;
      }
      .vertex-dot {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: vertexPop 0.4s ease-out forwards;
      }
      .hud-bar {
        transform-origin: left center;
        animation: barGrow 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
    </style>
    <linearGradient id="radarSweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="920" height="360" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Card Header -->
  <g transform="translate(24, 34)">
    <rect x="0" y="0" width="28" height="20" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="6" y="14" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">~/</text>
    <text x="38" y="15" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Technical Capability &amp; Skill Radar</text>
    <text x="872" y="14" text-anchor="end" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Specialist Breakdown</text>
    <line x1="0" y1="28" x2="872" y2="28" stroke="#21262d" stroke-width="1"/>
  </g>

  <!-- Left: Skill Radar -->
  <g>
    <!-- Background Rotating Sweep Beam -->
    <path class="radar-sweep-beam" d="M 225 195 L 225 90 A 105 105 0 0 1 299.235 120.765 Z" fill="url(#radarSweepGrad)"/>
    <polygon points="225.0,168.8 243.6,176.4 251.2,195.0 243.6,213.6 225.0,221.2 206.4,213.6 198.8,195.0 206.4,176.4" fill="none" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
    <polygon points="225.0,142.5 262.1,157.9 277.5,195.0 262.1,232.1 225.0,247.5 187.9,232.1 172.5,195.0 187.9,157.9" fill="none" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
    <polygon points="225.0,116.2 280.7,139.3 303.8,195.0 280.7,250.7 225.0,273.8 169.3,250.7 146.2,195.0 169.3,139.3" fill="none" stroke="#21262d" stroke-width="1" stroke-dasharray="3,3"/>
    <polygon points="225.0,90.0 299.2,120.8 330.0,195.0 299.2,269.2 225.0,300.0 150.8,269.2 120.0,195.0 150.8,120.8" fill="none" stroke="#30363d" stroke-width="1" />
    <line x1="225" y1="195" x2="225.0" y2="90.0" stroke="#21262d" stroke-width="1"/>
    <line x1="225" y1="195" x2="299.2" y2="120.8" stroke="#21262d" stroke-width="1"/>
    <line x1="225" y1="195" x2="330.0" y2="195.0" stroke="#21262d" stroke-width="1"/>
    <line x1="225" y1="195" x2="299.2" y2="269.2" stroke="#21262d" stroke-width="1"/>
    <line x1="225" y1="195" x2="225.0" y2="300.0" stroke="#21262d" stroke-width="1"/>
    <line x1="225" y1="195" x2="150.8" y2="269.2" stroke="#21262d" stroke-width="1"/>
    <line x1="225" y1="195" x2="120.0" y2="195.0" stroke="#21262d" stroke-width="1"/>
    <line x1="225" y1="195" x2="150.8" y2="120.8" stroke="#21262d" stroke-width="1"/>
    <!-- Radar Data Polygon -->
    <polygon class="radar-poly" points="225.0,102.6 287.4,132.6 311.1,195.0 282.9,252.9 225.0,272.7 173.0,247.0 153.6,195.0 161.9,131.9" fill="rgba(255, 255, 255, 0.09)" stroke="#ffffff" stroke-width="1.8"/>

    <circle class="vertex-dot" cx="225.0" cy="102.6" r="3.5" fill="#ffffff" stroke="#0d1117" stroke-width="1.5" style="animation-delay: 0.30s;"/>
    <circle class="vertex-dot" cx="287.4" cy="132.6" r="3.5" fill="#ffffff" stroke="#0d1117" stroke-width="1.5" style="animation-delay: 0.38s;"/>
    <circle class="vertex-dot" cx="311.1" cy="195.0" r="3.5" fill="#ffffff" stroke="#0d1117" stroke-width="1.5" style="animation-delay: 0.46s;"/>
    <circle class="vertex-dot" cx="282.9" cy="252.9" r="3.5" fill="#ffffff" stroke="#0d1117" stroke-width="1.5" style="animation-delay: 0.54s;"/>
    <circle class="vertex-dot" cx="225.0" cy="272.7" r="3.5" fill="#ffffff" stroke="#0d1117" stroke-width="1.5" style="animation-delay: 0.62s;"/>
    <circle class="vertex-dot" cx="173.0" cy="247.0" r="3.5" fill="#ffffff" stroke="#0d1117" stroke-width="1.5" style="animation-delay: 0.70s;"/>
    <circle class="vertex-dot" cx="153.6" cy="195.0" r="3.5" fill="#ffffff" stroke="#0d1117" stroke-width="1.5" style="animation-delay: 0.78s;"/>
    <circle class="vertex-dot" cx="161.9" cy="131.9" r="3.5" fill="#ffffff" stroke="#0d1117" stroke-width="1.5" style="animation-delay: 0.86s;"/>
    <text x="225.0" y="72.0" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">React Native</text>
    <text x="316.2" y="109.2" text-anchor="start" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Next.js / React</text>
    <text x="354.0" y="199.0" text-anchor="start" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">TypeScript</text>
    <text x="316.2" y="288.8" text-anchor="start" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Python / PyTorch</text>
    <text x="225.0" y="326.0" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Kotlin / Android</text>
    <text x="133.8" y="288.8" text-anchor="end" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Deep Learning</text>
    <text x="96.0" y="199.0" text-anchor="end" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Model Deployment</text>
    <text x="133.8" y="109.2" text-anchor="end" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Git &amp; CI/CD</text>
  </g>

  <!-- Center Divider -->
  <line x1="435" y1="80" x2="435" y2="330" stroke="#21262d" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Right: Proficiency Progress HUD -->
  <g>

    <!-- Skill 1: React Native -->
    <g transform="translate(460, 90)">
      <text x="0" y="0" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600">React Native</text>
      <text x="410" y="0" text-anchor="end" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Mobile • <tspan fill="#ffffff" font-weight="600">88%</tspan></text>
      <!-- Track -->
      <rect x="0" y="8" width="410" height="6" rx="3" fill="#161b22" stroke="#21262d" stroke-width="1"/>
      <!-- Fill with CSS grow animation -->
      <rect class="hud-bar bar-0" x="0" y="8" width="360.8" height="6" rx="3" fill="#ffffff" style="animation-delay: 0.20s;"/>
    </g>

    <!-- Skill 2: Git &amp; CI/CD -->
    <g transform="translate(460, 130)">
      <text x="0" y="0" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Git &amp; CI/CD</text>
      <text x="410" y="0" text-anchor="end" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">DevOps • <tspan fill="#ffffff" font-weight="600">85%</tspan></text>
      <!-- Track -->
      <rect x="0" y="8" width="410" height="6" rx="3" fill="#161b22" stroke="#21262d" stroke-width="1"/>
      <!-- Fill with CSS grow animation -->
      <rect class="hud-bar bar-1" x="0" y="8" width="348.5" height="6" rx="3" fill="#ffffff" style="animation-delay: 0.32s;"/>
    </g>

    <!-- Skill 3: Next.js / React -->
    <g transform="translate(460, 170)">
      <text x="0" y="0" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Next.js / React</text>
      <text x="410" y="0" text-anchor="end" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Web • <tspan fill="#ffffff" font-weight="600">84%</tspan></text>
      <!-- Track -->
      <rect x="0" y="8" width="410" height="6" rx="3" fill="#161b22" stroke="#21262d" stroke-width="1"/>
      <!-- Fill with CSS grow animation -->
      <rect class="hud-bar bar-2" x="0" y="8" width="344.4" height="6" rx="3" fill="#ffffff" style="animation-delay: 0.44s;"/>
    </g>

    <!-- Skill 4: TypeScript -->
    <g transform="translate(460, 210)">
      <text x="0" y="0" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600">TypeScript</text>
      <text x="410" y="0" text-anchor="end" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Web • <tspan fill="#ffffff" font-weight="600">82%</tspan></text>
      <!-- Track -->
      <rect x="0" y="8" width="410" height="6" rx="3" fill="#161b22" stroke="#21262d" stroke-width="1"/>
      <!-- Fill with CSS grow animation -->
      <rect class="hud-bar bar-3" x="0" y="8" width="336.2" height="6" rx="3" fill="#ffffff" style="animation-delay: 0.56s;"/>
    </g>

    <!-- Skill 5: Python / PyTorch -->
    <g transform="translate(460, 250)">
      <text x="0" y="0" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Python / PyTorch</text>
      <text x="410" y="0" text-anchor="end" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">AI / ML • <tspan fill="#ffffff" font-weight="600">78%</tspan></text>
      <!-- Track -->
      <rect x="0" y="8" width="410" height="6" rx="3" fill="#161b22" stroke="#21262d" stroke-width="1"/>
      <!-- Fill with CSS grow animation -->
      <rect class="hud-bar bar-4" x="0" y="8" width="319.8" height="6" rx="3" fill="#ffffff" style="animation-delay: 0.68s;"/>
    </g>

    <!-- Skill 6: Kotlin / Android -->
    <g transform="translate(460, 290)">
      <text x="0" y="0" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Kotlin / Android</text>
      <text x="410" y="0" text-anchor="end" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Mobile • <tspan fill="#ffffff" font-weight="600">74%</tspan></text>
      <!-- Track -->
      <rect x="0" y="8" width="410" height="6" rx="3" fill="#161b22" stroke="#21262d" stroke-width="1"/>
      <!-- Fill with CSS grow animation -->
      <rect class="hud-bar bar-5" x="0" y="8" width="303.4" height="6" rx="3" fill="#ffffff" style="animation-delay: 0.80s;"/>
    </g>
  </g>
</svg>
